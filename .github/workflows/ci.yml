name: CI Pipeline

on:
  push:
    branches: [ "main", "master", "develop", "tp3-starter" ]
  pull_request:
    branches: [ "main", "master", "develop", "tp3-starter" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    # Habilitamos los servicios de Docker para que Testcontainers pueda levantar PostgreSQL
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '26'
          cache: 'maven'

      - name: Dar permisos de ejecución al Maven Wrapper
        run: chmod +x mvnw

      - name: Compilar y ejecutar pruebas (Unitarias e Integración)
        run: ./mvnw verify