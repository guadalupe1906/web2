spring.application.name=demo

# Conexión a PostgreSQL (variables de entorno, con valores por defecto para local)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/app_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Hibernate solo valida, el esquema lo maneja Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=${JWT_SECRET:cambiar-este-secreto-por-uno-largo-de-al-menos-32-caracteres}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}